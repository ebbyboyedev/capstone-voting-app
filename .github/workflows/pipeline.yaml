name: Test

on:
    push:
        branches:
            - main


jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Start Docker service
              run:  docker compose up -d

            - name: Run tests
              run:  sh scripts/smoke-test.sh


    scan:
        name: Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

# The first call to the action will invoke setup-trivy and install trivy

            - name: Generate Trivy Vulnerability Report
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               scan-type: "fs"
               output: trivy-report.json
               format: json
               scan-ref: .
               exit-code: 0

            - name: Upload Vulnerability Scan Results
              uses: actions/upload-artifact@v4
              with:
               name: trivy-report
               path: trivy-report.json
               retention-days: 30

            - name: Fail build on High/Critical Vulnerabilities
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               scan-type: "fs"
               format: table
               scan-ref: .
               severity: HIGH,CRITICAL
               ignore-unfixed: true
               exit-code: 1
# On a subsequent call to the action we know trivy is already installed so can skip this
               skip-setup-trivy: true 



    build-vote:

        name: Build vote

        uses: dockersamples/.github/.github/workflows/reusable-docker-build.yaml@main

        permissions:
           contents: read
           packages: write # needed to push docker image to ghcr.io
           pull-requests: write # needed to create and update comments in PRs

        with:
      
          ### REQUIRED
          ### ENABLE ONE OR BOTH REGISTRIES
          ### tell docker where to push.
          ### NOTE if Docker Hub is set to true, you must set secrets above and also add account/repo/tags below
           dockerhub-enable: false
           ghcr-enable: true

            ### REQUIRED 
            ### A list of the account/repo names for docker build. List should match what's enabled above
            ### defaults to:
           image-names: |
             ghcr.io/ebbyboyedev/capstone-voting-app-vote

    ### REQUIRED set rules for tagging images, based on special action syntax:
      ### https://github.com/docker/metadata-action#tags-input
      ### defaults to:
           tag-rules: |
             type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
             type=raw,value=before,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
             type=raw,value=after,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
             type=ref,event=pr
             type=sha
      
      ### path to where docker should copy files into image
      ### defaults to root of repository (.)
           context: vote
      
      ### Dockerfile alternate name. Default is Dockerfile (relative to context path)
      # file: Containerfile

      ### build stage to target, defaults to empty, which builds to last stage in Dockerfile
      # target:
      
      ### platforms to build for, defaults to linux/amd64
      ### other options: linux/amd64,linux/arm64,linux/arm/v7
           platforms: linux/amd64,linux/arm64,linux/arm/v7
      
      ### Create a PR comment with image tags and labels
      ### defaults to false
      # comment-enable: false

        needs: [test, scan]

    build-result:

        name: Build result
        uses: dockersamples/.github/.github/workflows/reusable-docker-build.yaml@main

        permissions:
           contents: read
           packages: write # needed to push docker image to ghcr.io
           pull-requests: write # needed to create and update comments in PRs
    
        with:
      
      ### REQUIRED
      ### ENABLE ONE OR BOTH REGISTRIES
      ### tell docker where to push.
      ### NOTE if Docker Hub is set to true, you must set secrets above and also add account/repo/tags below
            dockerhub-enable: false
            ghcr-enable: true

      ### REQUIRED 
      ### A list of the account/repo names for docker build. List should match what's enabled above
      ### defaults to:
            image-names: |
              ghcr.io/ebbyboyedev/capstone-voting-app-result
      
      ### REQUIRED set rules for tagging images, based on special action syntax:
      ### https://github.com/docker/metadata-action#tags-input
      ### defaults to:
            tag-rules: |
              type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
              type=raw,value=before,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
              type=raw,value=after,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
              type=ref,event=pr
              type=sha
      
      ### path to where docker should copy files into image
      ### defaults to root of repository (.)
            context: result
      
      ### Dockerfile alternate name. Default is Dockerfile (relative to context path)
      # file: Containerfile

      ### build stage to target, defaults to empty, which builds to last stage in Dockerfile
      # target:
      
      ### platforms to build for, defaults to linux/amd64
      ### other options: linux/amd64,linux/arm64,linux/arm/v7
            platforms: linux/amd64,linux/arm64,linux/arm/v7
      
      ### Create a PR comment with image tags and labels
      ### defaults to false
      # comment-enable: false
        
        needs: [test, scan]